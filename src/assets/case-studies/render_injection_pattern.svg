  <title
     id="title1">Diagram of a render-injection composition pattern</title>
  <desc
     id="desc1">A specialized widget supplies its own custom render logic as a function prop into a generic widget. The generic widget owns a shared data hook and falls back to a default render function if none is provided. The generic widget wraps a shared presentational shell handling common chrome like search and filters.</desc>
